name: dynamic
options:
  bundleIdPrefix: com.dynamicisland
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "5"
targets:
  dynamic:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dynamicisland.dynamic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: dynamic
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    dependencies:
      - target: DynamicWidget
  DynamicWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleDisplayName: dynamic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dynamicisland.dynamic.widget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  dynamic:
    build:
      targets:
        dynamic: all
        DynamicWidget: all
    run:
      config: Debug
    archive:
      config: Release
