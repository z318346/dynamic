name: Build dynamic IPA
on:
  push:
    branches: [main, advanced-1.3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          python3 Scripts/icon.py
          xcodegen generate
      - name: Build unsigned device app
        run: |
          set -euo pipefail
          xcodebuild -project dynamic.xcodeproj -scheme dynamic -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Package and verify IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/build/Build/Products/Release-iphoneos/dynamic.app"
          test -f "$APP/dynamic"
          test -f "$APP/PlugIns/DynamicWidget.appex/DynamicWidget"
          file "$APP/dynamic" "$APP/PlugIns/DynamicWidget.appex/DynamicWidget"
          mkdir -p "$RUNNER_TEMP/package/Payload"
          ditto "$APP" "$RUNNER_TEMP/package/Payload/dynamic.app"
          (cd "$RUNNER_TEMP/package" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/dynamic.ipa" Payload)
          unzip -t dynamic.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-unsigned
          path: dynamic.ipa
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/advanced-1.3'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dynamic-unsigned
          path: dist
      - name: Publish v1.3.1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          unzip -t dist/dynamic.ipa
          if gh release view v1.3.1 >/dev/null 2>&1; then
            echo "v1.3.1 already exists; leaving release unchanged."
            exit 0
          fi
          gh release create v1.3.1 dist/dynamic.ipa --target "$GITHUB_SHA" --title "dynamic 1.3.1" --latest --notes "Bản 1.3.1: bổ sung nhận diện thiết bị và bảng tương thích;  Live Activity trống, công cụ AI trên thiết bị tương thích, xuất hình nền và ảnh nền thẻ, nhập Wallet pass đã ký, chỉnh sửa và sao lưu plist cục bộ. Bố cục Dynamic Island chỉ xem trước. Không tích hợp worse_query, không đổi model hệ thống hay mở khóa Siri. IPA chưa ký; chưa kiểm thử trên iPhone thật."
