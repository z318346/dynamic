name: Build and release dynamic IPA
on:
  push:
    branches: [main, advanced-1.3]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dynamic-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      version: ${{ steps.package.outputs.version }}
      filename: ${{ steps.package.outputs.filename }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodebuild -version
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          python3 Scripts/icon.py
          xcodegen generate
      - name: Build iPhone app
        run: |
          set -euo pipefail
          xcodebuild -project dynamic.xcodeproj -scheme dynamic -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Sign ad-hoc and verify package
        id: package
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/build/Build/Products/Release-iphoneos/dynamic.app"
          EXT="$APP/PlugIns/DynamicWidget.appex"
          test -f "$APP/dynamic"
          test -f "$EXT/DynamicWidget"
          file "$APP/dynamic" "$EXT/DynamicWidget"
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          EXT_VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$EXT/Info.plist")
          test "$VERSION" = "$EXT_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$VERSION"
          fi
          /usr/bin/codesign --force --sign - --timestamp=none "$EXT"
          /usr/bin/codesign --force --sign - --timestamp=none "$APP"
          /usr/bin/codesign --verify --strict --verbose=2 "$EXT"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"
          mkdir -p "$RUNNER_TEMP/package/Payload" "$GITHUB_WORKSPACE/dist"
          ditto "$APP" "$RUNNER_TEMP/package/Payload/dynamic.app"
          NAME="dynamic_${VERSION}.ipa"
          (cd "$RUNNER_TEMP/package" && /usr/bin/zip -qry "$GITHUB_WORKSPACE/dist/$NAME" Payload)
          cd "$GITHUB_WORKSPACE/dist"
          unzip -t "$NAME"
          shasum -a 256 "$NAME" > "$NAME.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "filename=$NAME" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dynamic-${{ steps.package.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.ref == 'refs/heads/advanced-1.3' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dynamic-${{ needs.build.outputs.version }}
          path: dist
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          NAME: ${{ needs.build.outputs.filename }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c "$NAME.sha256" && unzip -t "$NAME")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Preserving existing assets."
            exit 0
          fi
          gh release create "$TAG" "dist/$NAME" "dist/$NAME.sha256" CHANGELOG.md CHANGELOG_VI.md --target "$GITHUB_SHA" --title "dynamic $VERSION" --notes-file CHANGELOG_VI.md --latest
